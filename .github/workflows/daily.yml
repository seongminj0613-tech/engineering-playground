name: Daily Idea Pipeline

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 00:00 UTC (KST 09:00)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # ✅ (선택) 너의 파이프라인이 따로 있으면 여기서 먼저 돌려
      # - name: Run pipeline
      #   run: |
      #     python -m app.pipeline.main

      - name: Render HTML (index + history)
        run: |
          python -m app.presentation.render_topn_html 25

      - name: Commit & push docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/index.html docs/history
          git status
          git commit -m "chore: update daily idea pages" || echo "No changes to commit"
          git push