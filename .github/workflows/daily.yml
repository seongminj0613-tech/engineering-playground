name: Daily Idea Pipeline

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 00:00 UTC (KST 09:00)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Debug workspace
        run: |
          echo "=== WORKSPACE ==="
          pwd
          ls -al

      - name: Debug workspace files
        run: |
          echo "PWD=$(pwd)"
          ls -al
          find . -name "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run idea pipeline
        run: |
          python -m app.main

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: daily-reports
          path: |
            reports
            snapshots
            data/reports

      - name: Commit generated reports
        if: ${{ github.actor != 'github-actions[bot]' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f reports snapshots data/reports
          git commit -m "chore: update daily reports" || echo "No changes to commit"
          git push