name: Daily Idea Pipeline

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 00:00 UTC (KST 09:00)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Update history snapshot
        run: |
         python -m app.presentation.update_history_snapshot --help || true
         python app/presentation/update_history_snapshot.py
      
      - name: Build daily diff (D-1)
        run: |
          python -m app.presentation.plot_daily_diff


      - name: Render HTML (index + history)
        run: |
          python -m app.presentation.render_topn_html 25
          

      - name: Publish run_latest.json to docs
        run: |
          python -m app.presentation.publish_run_latest


      - name: Commit & push docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/index.html docs/history
          git status
          git commit -m "chore: update daily idea pages" || echo "No changes to commit"
          git push


      - name: Job Summary (latest run)
        run: |
          echo "## SignalRank Daily Run" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "docs/run_latest.json" ]; then
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat docs/run_latest.json >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "No run_latest.json found." >> $GITHUB_STEP_SUMMARY
          fi